tables:
  - id: d1a7c3e0-4b2f-4a61-9c5d-7e8f0a1b2c01
    name: 認証・権限
    description: ログイン状態とロールによって、登録処理に進めるかを決める。
    conditions:
      - name: 認証
        values: [あり, なし]
      - name: ロール
        values: [admin, viewer]
    actions:
      - 登録処理に進む
      - 401を返す
      - 403を返す
    rules:
      - id: a0b1c2d3-0001-4e5f-8a9b-0c1d2e3f4a01
        when: {認証: あり, ロール: admin}
        then: [登録処理に進む]
        cases:
          - 8c1d2f4a-6b3e-4f7a-9d21-5e8b7c0a1f01
      - id: a0b1c2d3-0002-4e5f-8a9b-0c1d2e3f4a02
        when: {認証: なし, ロール: '-'}
        then: [401を返す]
        cases:
          - 6b4e8d02-f1a9-4c37-b2d5-0a9c7e3f1807
      - id: a0b1c2d3-0003-4e5f-8a9b-0c1d2e3f4a03
        when: {認証: あり, ロール: viewer}
        then: [403を返す]
        cases:
          - d9c2a5f7-3e81-4b06-9f4a-6c1b8e0d2a08

  - id: d1a7c3e0-4b2f-4a61-9c5d-7e8f0a1b2c02
    name: 入力値のチェック
    description: リクエストボディの内容によるレスポンスの違い。
    conditions:
      - name: 名前
        values: [あり, 空]
      - name: メール形式
        values: [正しい, 不正]
      - name: メール重複
        values: [なし, あり]
    actions:
      - 201で登録される
      - 400を返す
      - 409を返す
    rules:
      - id: b0b1c2d3-0001-4e5f-8a9b-0c1d2e3f4b01
        when: {名前: あり, メール形式: 正しい, メール重複: なし}
        then: [201で登録される]
        cases:
          - 8c1d2f4a-6b3e-4f7a-9d21-5e8b7c0a1f01
          - 2f9b7e13-0c4d-4a8e-b5f2-71d3e6a9c402
          - c47a0e85-91b2-4d6f-8a3c-0e5f2b7d1803
      - id: b0b1c2d3-0002-4e5f-8a9b-0c1d2e3f4b02
        when: {名前: 空, メール形式: 正しい, メール重複: '-'}
        then: [400を返す]
        cases:
          - 5e0d3b9c-27f8-4c1a-9e64-b8a2d0f3c504
      - id: b0b1c2d3-0003-4e5f-8a9b-0c1d2e3f4b03
        when: {名前: あり, メール形式: 不正, メール重複: '-'}
        then: [400を返す]
        cases:
          - a81f6c27-4d3e-4b90-8c15-3f7e9a2b6d05
      - id: b0b1c2d3-0004-4e5f-8a9b-0c1d2e3f4b04
        when: {名前: あり, メール形式: 正しい, メール重複: あり}
        then: [409を返す]
        cases:
          - 3f2a9c1e-84b2-4d7a-a189-98e3b56cf206
      - id: b0b1c2d3-0005-4e5f-8a9b-0c1d2e3f4b05
        when: {名前: 空, メール形式: 不正, メール重複: '-'}
        then: [400を返す]
        skip: 名前が空の時点で400になり、R2と同じ処理を通るため省略

  - id: d1a7c3e0-4b2f-4a61-9c5d-7e8f0a1b2c03
    name: 与信APIの応答
    description: 外部の与信APIの応答によるレスポンスの違い。
    conditions:
      - name: 与信APIの応答
        values: ['200', '400', タイムアウト, '500']
    actions:
      - 201で登録される
      - 400を返す
      - 504を返す
      - 502を返す
    rules:
      - id: c0b1c2d3-0001-4e5f-8a9b-0c1d2e3f4c01
        when: {与信APIの応答: '200'}
        then: [201で登録される]
        cases:
          - 8c1d2f4a-6b3e-4f7a-9d21-5e8b7c0a1f01
      - id: c0b1c2d3-0002-4e5f-8a9b-0c1d2e3f4c02
        when: {与信APIの応答: '400'}
        then: [400を返す]
        cases:
          - b2e8f4c9-1d7a-4e35-9c60-8f3a2d5b7e11
      - id: c0b1c2d3-0003-4e5f-8a9b-0c1d2e3f4c03
        when: {与信APIの応答: タイムアウト}
        then: [504を返す]
        cases:
          - e5a1c7d3-9f02-4b8e-a4d6-2c7e0b9f3a12
      - id: c0b1c2d3-0004-4e5f-8a9b-0c1d2e3f4c04
        when: {与信APIの応答: '500'}
        then: [502を返す]
        cases: []
