meta:
  type: ui
  name: 会員登録画面
updatedAt: "2026-10-24"
changes: 初版作成
cases:
  - id: 4d8e2a61-7c3b-4f09-a5d2-c1e6b9f3a301
    status: 有効
    perspective: 正常
    execution: 自動
    title: 会員登録してログインできる
    description: 会員登録画面で登録した内容で、ログイン画面からログインできることを確認する。
    steps:
      - action: 会員登録画面を開く
      - action: 名前に `{任意の名前}`、メールアドレスに `{未登録のメールアドレス}`、パスワードに `password123` を入力し、利用規約に同意して「登録する」ボタンを押す
        expected:
          - 登録完了画面に遷移する
      - action: ログイン画面を開き、登録したメールアドレスとパスワードを入力して「ログイン」ボタンを押す
        expected:
          - マイページに遷移する
          - ヘッダーに登録した名前が表示される
    notes:
      - users テーブルに入力するメールアドレスのレコードが存在しないこと
  - id: 9a1c5e73-2b8d-4e6f-b3a7-d4f2c8e1b302
    status: 有効
    perspective: 正常
    execution: 手動
    title: 登録完了メールが届く
    description: 会員登録後、入力したメールアドレス宛てに登録完了メールが届くことを確認する。
    steps:
      - action: 会員登録画面で、受信できるメールアドレスを入力して登録する
        expected:
          - 登録完了画面に遷移する
      - action: メールの受信箱を確認する
        expected:
          - 件名「【サンプル】会員登録が完了しました」のメールが届いている
    notes:
      - 受信を確認できるメールアドレスを用意すること
  - id: 6f3b9d24-8e1a-4c75-9b0e-a7d3f5c2e303
    status: 有効
    perspective: 異常
    execution: 自動
    title: 登録済みのメールアドレスでは登録できない
    description: 既に登録されているメールアドレスで登録しようとした場合、エラーが表示され登録されないことを確認する。
    steps:
      - action: 会員登録画面で、メールアドレスに `{登録済みのメールアドレス}` を入力して「登録する」ボタンを押す
        expected:
          - 画面上部に「指定されたメールアドレスは既に登録されています」と表示される
          - 会員登録画面のままである
